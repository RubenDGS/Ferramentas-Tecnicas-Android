name: Criar APK Ferramentas Técnicas v13 Local Melhorado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Criar projeto Android
        shell: bash
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          printf '%s' '' | base64 -d > 'settings.gradle'
          mkdir -p "$(dirname 'build.gradle')"
          printf '%s' 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'gradle.properties')"
          printf '%s' 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgzMDcybSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'app/build.gradle')"
          printf '%s' '' | base64 -d > 'app/build.gradle'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          printf '%s' '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          printf '%s' '' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "$(dirname 'app/src/main/res/xml/file_paths.xml')"
          printf '%s' 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHBhdGhzIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8Y2FjaGUtcGF0aCBuYW1lPSJjYW1lcmEiIHBhdGg9ImNhbWVyYS8iIC8+CjwvcGF0aHM+Cg==' | base64 -d > 'app/src/main/res/xml/file_paths.xml'
          mkdir -p "$(dirname 'app/src/main/java/pt/ferramentastecnicas/HomeActivity.java')"
          printf '%s' '' | base64 -d > 'app/src/main/java/pt/ferramentastecnicas/HomeActivity.java'
          mkdir -p "$(dirname 'app/src/main/java/pt/ferramentastecnicas/ThermalActivity.java')"
          printf '%s' '' | base64 -d > 'app/src/main/java/pt/ferramentastecnicas/ThermalActivity.java'
          mkdir -p "$(dirname 'app/src/main/java/pt/ferramentastecnicas/PTMActivity.java')"
          printf '%s' '' | base64 -d > 'app/src/main/java/pt/ferramentastecnicas/PTMActivity.java'
          mkdir -p "$(dirname 'app/src/main/java/pt/ferramentastecnicas/PTMLocalActivity.java')"
          printf '%s' '' | base64 -d > 'app/src/main/java/pt/ferramentastecnicas/PTMLocalActivity.java'
          mkdir -p "$(dirname 'app/src/main/assets/ptm.html')"
          printf '%s' '' | base64 -d > 'app/src/main/assets/ptm.html'
          mkdir -p "$(dirname 'app/src/main/assets/ptm-local.html')"
          printf '%s' '' | base64 -d > 'app/src/main/assets/ptm-local.html'
      - name: Criar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ferramentas-Tecnicas-APK-v13-Local-Melhorado
          path: app/build/outputs/apk/debug/app-debug.apk
